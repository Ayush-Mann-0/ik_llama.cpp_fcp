name: Windows CUDA Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-cuda-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-cuda:
    name: Build Windows x64 (CUDA)
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # CUDA 12.8 supports Blackwell (compute capability 12.0), including RTX 50-series.
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Configure Release build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90;120" `
            -DLLAMA_CURL=OFF `
            -DBUILD_SHARED_LIBS=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4

      - name: Verify key executables
        shell: pwsh
        run: |
          $required = @(
            "build/bin/llama-server.exe",
            "build/bin/llama-cli.exe",
            "build/bin/llama-bench.exe",
            "build/bin/llama-quantize.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Expected executable was not produced: $file"
              exit 1
            }
          }
          ./build/bin/llama-server.exe --version
          ./build/bin/llama-cli.exe --version

      - name: Stage portable package
        shell: pwsh
        run: |
          $stage = "dist/ik_llama.cpp-windows-x64-cuda"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/bin/*" $stage -Recurse -Force

          # Bundle CUDA runtime DLLs needed by a portable Windows build.
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          foreach ($dll in @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll")) {
            $source = Join-Path $cudaBin $dll
            if (Test-Path $source) {
              Copy-Item $source $stage -Force
            } else {
              Write-Error "Required CUDA runtime DLL not found: $source"
              exit 1
            }
          }

          Copy-Item "LICENSE" $stage -Force
          if (Test-Path "README.md") {
            Copy-Item "README.md" $stage -Force
          }
          @"
          Windows x64 CUDA build of Ayush-Mann-0/ik_llama.cpp_fcp.

          GPU support: NVIDIA CUDA.
          CUDA architectures compiled: 75, 80, 86, 89, 90, 120.
          Model files are not included.

          If a program fails to start because a runtime DLL is missing, install the
          Microsoft Visual C++ 2015-2022 Redistributable (x64). A compatible NVIDIA
          driver is also required for CUDA inference.
          "@ | Set-Content "$stage/BUILD-INFO.txt"

          Compress-Archive -Path "$stage/*" `
            -DestinationPath "dist/ik_llama.cpp-windows-x64-cuda.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ik_llama.cpp-windows-x64-cuda
          path: dist/ik_llama.cpp-windows-x64-cuda.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ik_llama.cpp-windows-x64-cuda.zip
